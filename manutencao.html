<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Em manutenção — Barbara Camarotti</title>
<meta name="description" content="O portfólio de Barbara Camarotti está passando por uma atualização. Volte em instantes.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%237c3aed'/%3E%3Cstop offset='100%25' stop-color='%23ff2a7a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='26' fill='url(%23g)'/%3E%3Ctext x='50%25' y='55%25' text-anchor='middle' dominant-baseline='central' font-family='system-ui, sans-serif' font-weight='900' font-size='48' fill='%23ffffff'%3EBC%3C/text%3E%3C/svg%3E">

<style>
:root { --bg: #090a0f; --accent: #7c3aed; --pink: #ff2a7a; --muted: #94a3b8; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh; min-height: 100dvh;
  display: grid; place-items: center; padding: 24px;
  background: var(--bg); color: #f8fafc;
  font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden;
}
.blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .55; z-index: -1; animation: float 14s ease-in-out infinite; }
.b1 { width: 420px; height: 420px; background: var(--accent); top: -120px; left: -100px; }
.b2 { width: 360px; height: 360px; background: var(--pink); bottom: -120px; right: -80px; animation-delay: -7s; opacity: .35; }
@keyframes float { 50% { transform: translate(40px, 30px) scale(1.1); } }

.card {
  max-width: 520px; width: 100%; text-align: center;
  padding: 44px 32px; border-radius: 20px;
  background: rgba(22, 24, 35, .6); border: 1px solid rgba(255,255,255,.1);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 24px 60px rgba(0,0,0,.5);
  animation: rise .7s cubic-bezier(.16,1,.3,1);
}
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }

.logo {
  width: 76px; height: 76px; margin: 0 auto 26px; border-radius: 22px;
  display: grid; place-items: center; position: relative;
  background: linear-gradient(135deg, var(--accent), var(--pink));
  font: 800 1.7rem 'Space Grotesk', sans-serif;
  box-shadow: 0 10px 30px rgba(124,58,237,.45);
}
.logo::after {
  content: ""; position: absolute; inset: -8px; border-radius: 28px;
  border: 2px solid transparent; border-top-color: #c4b5fd; border-right-color: var(--pink);
  animation: spin 1.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.tag {
  display: inline-flex; align-items: center; gap: 8px; margin-bottom: 14px;
  padding: 6px 12px; border-radius: 8px; font-size: .75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.5px;
  color: #fcd34d; background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.3);
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 10px #f59e0b; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .3; } }

h1 { font-size: 1.9rem; font-weight: 800; line-height: 1.2; letter-spacing: -.5px; margin-bottom: 12px; }
h1 span { background: linear-gradient(90deg, #c4b5fd, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
p { color: var(--muted); font-size: .98rem; line-height: 1.6; margin-bottom: 26px; }

.bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; margin-bottom: 28px; }
.bar i { display: block; height: 100%; width: 40%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--pink)); animation: load 1.8s ease-in-out infinite; }
@keyframes load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px;
  border-radius: 10px; font-weight: 600; font-size: .88rem; text-decoration: none;
  color: #fff; transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
}
.btn-primary { background: linear-gradient(135deg, var(--accent), #6d28d9); box-shadow: 0 4px 18px rgba(124,58,237,.38); }
.btn-secondary { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); }
.btn:hover { transform: translateY(-2px); }
.btn-secondary:hover { background: rgba(255,255,255,.1); }

@media (max-width: 480px) { .card { padding: 36px 22px; } h1 { font-size: 1.5rem; } }
@media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; } }
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>

<main class="card">
  <div class="logo" aria-hidden="true">BC</div>
  <span class="tag"><span class="dot"></span> Em manutenção</span>
  <h1>Novos trabalhos <span>renderizando</span>.</h1>
  <p>Estou atualizando o portfólio com projetos novos. Volte em alguns minutos. Enquanto isso, fale comigo pelos canais abaixo.</p>
  <div class="bar"><i></i></div>
  <div class="actions">
    <a id="btn-whatsapp" class="btn btn-primary" href="https://wa.me/5511991614359?text=Ol%C3%A1%2C%20Barbara!%20Vim%20pelo%20seu%20portf%C3%B3lio." target="_blank" rel="noopener">WhatsApp 💬</a>
    <a id="btn-linkedin" class="btn btn-secondary" href="https://www.linkedin.com/in/barbaracamarotti" target="_blank" rel="noopener">LinkedIn ↗</a>
    <a id="btn-behance" class="btn btn-secondary" href="https://www.behance.net/barbaracamarot" target="_blank" rel="noopener">Behance ↗</a>
  </div>
</main>
</body>
</html>
